# Deployment stack for the Hostinger VPS.
#
# The box already runs Postiz and two vanuat stacks. Traefik owns ports 80/443, so this
# stack publishes NO host ports and is routed by the labels below — fully isolated from
# the existing apps: its own MySQL, its own volumes, its own network.
#
# Traefik on this box runs in HOST network mode, so there is NO shared proxy network to
# join: it reaches containers directly on their own private bridge network. Verified
# against the working vanuat stack, which uses exactly this pattern — one private
# network, entrypoint `websecure`, cert resolver `letsencrypt`.
#
#   docker compose --env-file .env.deploy up -d --build

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # MySQL 8.4 keeps caching_sha2_password. Inside the compose network the
    # connection is trusted, so Prisma's handshake works without the cold-cache
    # problem seen over plain TCP to an external host.
    volumes:
      - db-data:/var/lib/mysql
    networks: [ucpt]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file: [.env.backend]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      # User uploads must outlive the container — never bake them into the image.
      - uploads:/app/apps/backend/uploads
    networks: [ucpt]
    labels:
      # One domain serves all three apps, split by path — the same layout the previous
      # nginx setup used. No path stripping anywhere: the backend already mounts its
      # routes under /api/v1 and /uploads, and the admin app is built with
      # basePath: '/admin', so each service expects to see its own prefix.
      - traefik.enable=true
      - traefik.http.routers.ucpt-api.rule=(Host(`${WEB_DOMAIN}`) || Host(`www.${WEB_DOMAIN}`)) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))
      - traefik.http.routers.ucpt-api.entrypoints=websecure
      - traefik.http.routers.ucpt-api.tls.certresolver=letsencrypt
      # Explicit priority: Traefik orders by rule length by default, which happens to
      # work here, but stating it means a later rule edit can't silently reorder them.
      - traefik.http.routers.ucpt-api.priority=100
      - traefik.http.services.ucpt-api.loadbalancer.server.port=4000

  website:
    build:
      context: .
      target: website
      args:
        NEXT_PUBLIC_API_URL: https://${WEB_DOMAIN}
        NEXT_PUBLIC_API_BASE_URL: https://${WEB_DOMAIN}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        # www is what's linked and shared, so canonicals/sitemap point there.
        NEXT_PUBLIC_SITE_URL: https://www.${WEB_DOMAIN}
    restart: unless-stopped
    depends_on: [backend]
    networks: [ucpt]
    labels:
      - traefik.enable=true
      # Catch-all: anything not matched by the /api, /uploads or /admin routers above.
      - traefik.http.routers.ucpt-web.rule=Host(`${WEB_DOMAIN}`) || Host(`www.${WEB_DOMAIN}`)
      - traefik.http.routers.ucpt-web.entrypoints=websecure
      - traefik.http.routers.ucpt-web.tls.certresolver=letsencrypt
      - traefik.http.routers.ucpt-web.priority=1
      - traefik.http.services.ucpt-web.loadbalancer.server.port=3000

  admin:
    build:
      context: .
      target: admin
      args:
        NEXT_PUBLIC_API_URL: https://${WEB_DOMAIN}
        NEXT_PUBLIC_API_BASE_URL: https://${WEB_DOMAIN}
    restart: unless-stopped
    depends_on: [backend]
    networks: [ucpt]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ucpt-admin.rule=(Host(`${WEB_DOMAIN}`) || Host(`www.${WEB_DOMAIN}`)) && PathPrefix(`/admin`)
      - traefik.http.routers.ucpt-admin.entrypoints=websecure
      - traefik.http.routers.ucpt-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.ucpt-admin.priority=100
      - traefik.http.services.ucpt-admin.loadbalancer.server.port=3001

volumes:
  db-data:
  uploads:

networks:
  # Private to this stack. The database is not reachable from Postiz or vanuat, and
  # host-mode Traefik can still route into it — same as vanuat_vanuat.
  ucpt:
