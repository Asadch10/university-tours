# Reverse-proxy rules so one domain serves all three apps.
#
#   https://<domain>/           → website   (127.0.0.1:3000)
#   https://<domain>/_next/...  → website   (JS/CSS chunks — must NOT be served from disk)
#   https://<domain>/admin      → admin     (127.0.0.1:3001, next basePath=/admin;
#                                            its assets live under /admin/_next/)
#   https://<domain>/api/...    → backend   (127.0.0.1:4000, Express /api/v1)
#   https://<domain>/uploads/.. → backend   (uploaded images)
#
# IMPORTANT — Cloudways PHP-stack vhosts contain a regex location that serves
# static extensions (.js/.css/images) straight from public_html on disk. Regex
# locations override plain prefix locations, which breaks /_next/ chunk files
# (400/404) and /admin assets. Every block below therefore uses the `^~`
# modifier, which takes priority over regex locations. Do NOT drop the `^~`.
#
# Also ask Cloudways to DISABLE VARNISH for this application (or exclude all
# these paths) — this is a Node app; Varnish caching serves stale HTML that
# references deleted build chunks after each redeploy.
#
# On Cloudways you have no sudo: open a support ticket with this file and ask
# them to add these location blocks to the application's Nginx server block.
# (Order/priority matters — keep the `^~` modifiers exactly as written.)

# --- API ---
location ^~ /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;   # allow photo/ID uploads
}

# --- Uploaded images served by the backend ---
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Admin console (next basePath = /admin; also covers /admin/_next assets) ---
location ^~ /admin {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;         # Next HMR / websockets
    proxy_set_header Connection "upgrade";
}

# --- Website build assets (would otherwise be caught by the static-file regex) ---
location ^~ /_next/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Website (catch-all, must be LAST) ---
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
