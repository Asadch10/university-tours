# Reverse-proxy rules so one domain serves all three apps.
#
#   https://<domain>/           → website   (127.0.0.1:3000)
#   https://<domain>/admin      → admin     (127.0.0.1:3001, next basePath=/admin)
#   https://<domain>/api/...    → backend   (127.0.0.1:4000, Express /api/v1)
#   https://<domain>/uploads/.. → backend   (uploaded images)
#
# On Cloudways: add these `location` blocks to the application's Nginx vhost.
# Application Settings won't expose this directly, so either place them via SSH
# in the app's custom nginx include, or open a Cloudways support ticket asking
# them to add these reverse-proxy location blocks to your app's server block.
# (Order matters — the specific paths must come before the catch-all `/`.)

# --- API (must come before "/") ---
location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;   # allow photo/ID uploads
}

# --- Uploaded images served by the backend ---
location /uploads/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Admin console (next basePath = /admin) ---
location /admin {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;         # Next HMR / websockets
    proxy_set_header Connection "upgrade";
}

# --- Website (catch-all, must be LAST) ---
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
